# Authelia config for the Pantry staging demo (public-hosting exploration).
# Staging only. Secrets are placeholders; setup-authelia-staging.sh fills
# them in from openssl at install time. Never commit real secrets here.
server:
  address: tcp://127.0.0.1:9091
log:
  level: info
  format: text
totp:
  issuer: pantry-staging
  period: 30
  skew: 1
authentication_backend:
  password_reset:
    disable: true
  refresh_interval: 5m
  file:
    path: /etc/authelia/users_database.yml
    watch: false
    password:
      algorithm: argon2
      argon2:
        variant: argon2id
        iterations: 3
        memory: 65536
        parallelism: 4
        key_length: 32
        salt_length: 16
access_control:
  default_policy: deny
  rules:
    # DOMAIN is the public IP for the demo; a real deployment uses a domain name.
    - domain: DOMAIN
      policy: one_factor
      subject:
        - user:tony
session:
  name: authelia_session
  secret: SESSION_SECRET
  same_site: lax
  inactivity: 1h
  expiration: 1d
  remember_me: 1M
  cookies:
    - name: authelia_session
      domain: DOMAIN
      authelia_url: https://DOMAIN:8081
      default_redirection_url: https://DOMAIN:8080
storage:
  encryption_key: STORAGE_KEY
  local:
    path: /var/lib/authelia/db.sqlite3
notifier:
  filesystem:
    filename: /var/lib/authelia/notification.txt
